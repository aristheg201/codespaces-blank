plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Compile against the exact Bestiary/Cobblemon runtime target. This is not bundled.
    modCompileOnly "maven.modrinth:MdwFAVRL:gBW3vLC7"

    // Persistent compiled cache serializer. Bundled so the client does not need another mod/library.
    implementation "com.esotericsoftware:kryo:5.6.2"
    implementation "com.esotericsoftware:reflectasm:1.11.9"
    implementation "org.objenesis:objenesis:3.3"
    implementation "com.esotericsoftware:minlog:1.3.1"

    include "com.esotericsoftware:kryo:5.6.2"
    include "com.esotericsoftware:reflectasm:1.11.9"
    include "org.objenesis:objenesis:3.3"
    include "com.esotericsoftware:minlog:1.3.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("README.md") {
        rename { "BESTIARY-CLIENT-CORE-README.md" }
    }
}
