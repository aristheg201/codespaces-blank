name: Bestiary Launcher 5.4.9 - Electron Modpack Dialog Hotfix

on:
  push:
    branches:
      - hotfix/bestiary-launcher-v549-modpack-dialogs
    paths:
      - 'bestiary-v549/**'
      - '.github/workflows/build-bestiary-launcher-v549.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bestiary-v549-hotfix
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, typecheck, launch and click Create/Rename/Delete in Electron
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./bestiary-v549/build.ps1 *>&1 | Tee-Object -FilePath ci-v549.log
          if ($LASTEXITCODE -ne 0) { throw "Build exited $LASTEXITCODE" }
      - name: Upload verified Windows installer and UI QA logs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BestiaryLauncher-Windows-5.4.9-VERIFIED
          path: |
            build-output-v549/BestiaryLauncher-Setup-5.4.9.exe
            build-output-v549/BestiaryLauncher-Setup-5.4.9-SHA256.txt
            build-output-v549/feature-contract.txt
            build-output-v549/qa-create-v549.log
          retention-days: 30
          if-no-files-found: error
      - name: Upload build diagnostics on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bestiary-v549-failure
          path: |
            ci-v549.log
            qa-create-v549.log
          if-no-files-found: ignore

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows build that passed UI QA
        uses: actions/download-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.4.9-VERIFIED
          path: publish
      - name: Verify bytes and release to GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          exe='BestiaryLauncher-Setup-5.4.9.exe'
          expected="$(tr -d '\r' < BestiaryLauncher-Setup-5.4.9-SHA256.txt | awk '{print tolower($1)}')"
          actual="$(sha256sum "$exe" | awk '{print $1}')"
          test "${#expected}" -eq 64
          test "$expected" = "$actual"
          test "$(stat -c %s "$exe")" -gt 80000000
          grep -q 'QA PASS: Electron UI Create -> persist -> Rename -> Export dialog -> Delete' qa-create-v549.log
          grep -q '^createRenameDeleteE2E=true$' feature-contract.txt
          cd ..
          tag='launcher-v5.4.9'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$tag" \
            publish/BestiaryLauncher-Setup-5.4.9.exe \
            publish/BestiaryLauncher-Setup-5.4.9-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Bestiary Launcher 5.4.9 — Fix Create Modpack' \
            --notes 'Fix Create/Rename/Delete/Export modpack buttons by replacing unsupported Electron window.prompt/window.confirm with interactive in-app React dialogs. Actual Windows Electron UI test creates, renames, opens export options, and deletes a personal modpack. Retains the server-managed SVFrame Full/Lite profiles and auto-updater. Note: personal modpack launch and remote CurseForge API integration are still planned.' \
            --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fx 'BestiaryLauncher-Setup-5.4.9.exe'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fx 'BestiaryLauncher-Setup-5.4.9-SHA256.txt'
          echo "RELEASED launcher-v5.4.9 SHA256=$actual"
