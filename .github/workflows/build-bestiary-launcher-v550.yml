name: Bestiary Launcher 5.5.0 - Minecraft / Loader / NeoForge Profiles

on:
  push:
    branches:
      - feature/bestiary-launcher-multiloader-v550
    paths:
      - 'bestiary-v550/**'
      - '.github/workflows/build-bestiary-launcher-v550.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bestiary-launcher-v550-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build TypeScript and test Create NeoForge profile in Electron
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./bestiary-v550/build.ps1 *>&1 | Tee-Object -FilePath ci-v550.log
          if ($LASTEXITCODE -ne 0) { throw "Launcher 5.5.0 build or UI QA failed: $LASTEXITCODE" }
      - name: Upload 5.5.0 candidate only on verified pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.5.0-CANDIDATE
          path: |
            build-output-v550/BestiaryLauncher-Setup-5.5.0.exe
            build-output-v550/BestiaryLauncher-Setup-5.5.0-SHA256.txt
            build-output-v550/feature-contract.txt
            build-output-v550/qa-create-v550.log
            build-output-v550/qa-neoforge-install-v550.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bestiary-v550-diagnostics
          path: |
            ci-v550.log
            qa-create-v550.log
            qa-neoforge-install-v550.log
          if-no-files-found: ignore
