name: Publish Bestiary Launcher 5.5.0 from default branch

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-bestiary-launcher-v550-main.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '42260985683'
      VERIFIED_COMMIT: '466cee6483b7f3b1897612a97b387f694cbf7f2e'
      VERIFIED_SHA256: '1729ae65265488a68156a05d16bcb06d38809b213cb7693e46fab3ad593509c1'
      TAG: launcher-v5.5.0
    steps:
      - name: Verify actual successful NeoForge game launch run
        shell: bash
        run: |
          set -euo pipefail
          info="$(gh run view "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha)"
          test "$(jq -r .conclusion <<< "$info")" = success
          test "$(jq -r .headSha <<< "$info")" = "$VERIFIED_COMMIT"
          mkdir -p publish
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name BestiaryLauncher-Windows-5.5.0-CANDIDATE --dir publish
          exe=publish/BestiaryLauncher-Setup-5.5.0.exe
          test -s "$exe"
          actual="$(sha256sum "$exe" | cut -d ' ' -f1)"
          expected="$(tr -d '\r' < publish/BestiaryLauncher-Setup-5.5.0-SHA256.txt | awk '{print tolower($1)}')"
          test "$actual" = "$VERIFIED_SHA256"
          test "$actual" = "$expected"
          tr -d '\r' < publish/qa-create-v550.log | grep -F 'QA PASS: NeoForge Create -> selected metadata -> Rename -> Delete'
          tr -d '\r' < publish/qa-neoforge-install-v550.log | grep -F 'QA PASS: Real NeoForge 1.21.1'
          tr -d '\r' < publish/qa-neoforge-install-v550.log | grep -F 'QA PASS: NeoForge Minecraft Java process started and remained alive'
          echo "VERIFIED_SIZE=$(stat -c %s "$exe")" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" \
            publish/BestiaryLauncher-Setup-5.5.0.exe \
            publish/BestiaryLauncher-Setup-5.5.0-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_COMMIT" \
            --title "Bestiary Launcher 5.5.0 - NeoForge and custom modpacks" \
            --notes "Select Minecraft version, Vanilla/Fabric/Forge/NeoForge/Quilt and exact loader version per isolated modpack. CI confirms actual NeoForge 1.21.1 Java launch survives 15 seconds, UI CRUD and official installer. SVFrame Official remains Fabric-only and isolated. World creation and general mod compatibility not yet fully tested." \
            --latest
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="BestiaryLauncher-Setup-5.5.0.exe") | .digest')"
          test "$digest" = "sha256:$VERIFIED_SHA256"
          size="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="BestiaryLauncher-Setup-5.5.0.exe") | .size')"
          test "$size" = "$VERIFIED_SIZE"
          echo "RELEASED: $TAG $digest $size"
