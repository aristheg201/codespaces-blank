name: SVF toolchain cache

on:
  push:
    branches: [codex/svf-toolchain-cache]
    paths: ['.github/workflows/svf-toolchain-cache.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Create dependency-only Fabric project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p svf-cache-project
          cd svf-cache-project
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              maven { url = 'https://maven.fabricmc.net/' }
              gradlePluginPortal()
              mavenCentral()
            }
          }
          rootProject.name = 'svf-cache-project'
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.14
          fabric_version=0.116.15+1.21.1
          loom_version=1.9-SNAPSHOT
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'fabric-loom' version "${loom_version}"
            id 'maven-publish'
          }
          group = 'com.svframe'
          version = 'cache'
          repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
          dependencies {
            minecraft "com.mojang:minecraft:${minecraft_version}"
            mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
            implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
          }
          EOF
          mkdir -p src/main/java/com/example src/main/resources
          cat > src/main/java/com/example/Dummy.java <<'EOF'
          package com.example; public final class Dummy {}
          EOF
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {"schemaVersion":1,"id":"svf_cache_dummy","version":"1.0.0","name":"SVF cache dummy","environment":"*","entrypoints":{},"depends":{"fabricloader":">=0.16.0","minecraft":"1.21.1","java":">=21"}}
          EOF
      - name: Resolve Loom and dependencies
        working-directory: svf-cache-project
        run: gradle --no-daemon clean classes remapJar --stacktrace
      - name: Package local Gradle state and distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-out
          command -v gradle > cache-out/gradle-path.txt
          GRADLE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")"
          echo "$GRADLE_HOME" > cache-out/gradle-home.txt
          tar -C "$HOME" -czf cache-out/gradle-user-home.tar.gz .gradle
          tar -C "$(dirname "$GRADLE_HOME")" -czf cache-out/gradle-distribution.tar.gz "$(basename "$GRADLE_HOME")"
          cp -a svf-cache-project cache-out/project
          find cache-out -maxdepth 2 -type f -printf '%p %s\n' | sort | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: svf-gradle-fabric-toolchain-cache
          path: cache-out
          if-no-files-found: error
          retention-days: 1
