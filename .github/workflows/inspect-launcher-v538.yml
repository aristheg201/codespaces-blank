name: Inspect Bestiary Launcher 5.3.8 Baseline

on:
  push:
    branches: [bestiary-launcher-v5-3-8-microsoft-runtime-sync]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified 5.3.7 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./bestiary-v537/build.ps1
          if($LASTEXITCODE -ne 0){throw "5.3.7 reconstruction failed with $LASTEXITCODE"}
      - name: Collect runtime bridge source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force inspect-source | Out-Null
          Copy-Item source/src/main inspect-source/main -Recurse -Force
          Copy-Item source/src/shared inspect-source/shared -Recurse -Force
          Copy-Item source/src/preload inspect-source/preload -Recurse -Force
          Copy-Item source/src/renderer/src/store.ts inspect-source/store.ts -Force -ErrorAction SilentlyContinue
          Copy-Item source/src/renderer/src/App.tsx inspect-source/App.tsx -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-5.3.7-source-inspect
          path: inspect-source
          retention-days: 2
          if-no-files-found: error
      - name: Record inspect run
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m=[ordered]@{runId=[long]$env:GITHUB_RUN_ID;sourceCommit=$env:GITHUB_SHA;branch=$env:GITHUB_REF_NAME;ready=$true}|ConvertTo-Json
          $enc=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($m));$path='bestiary-v538/inspect.json';$old=''
          gh api "repos/$env:GITHUB_REPOSITORY/contents/${path}?ref=$($env:GITHUB_REF_NAME)" --jq '.sha' 2>$null|ForEach-Object{$old=$_}
          $payload=@{message='Record Launcher 5.3.8 source inspection [skip ci]';content=$enc;branch=$env:GITHUB_REF_NAME};if($old){$payload.sha=$old}
          ($payload|ConvertTo-Json -Compress)|gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/${path}" --input - *> $null
