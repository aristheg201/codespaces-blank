name: Build Bestiary Pack Manager 7.0.0 Fixed

on:
  push:
    branches:
      - bestiary-manager-v7-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force manager | Out-Null
          $parts = Get-ChildItem "bestiary-manager-v7-final-source/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("$PWD/manager-src-7.0.0.tar.gz", [Convert]::FromBase64String($b64))
          tar -xzf "$PWD/manager-src-7.0.0.tar.gz" -C "$PWD/manager"
          if ($LASTEXITCODE -ne 0) { throw "Unable to extract manager source archive" }
          if (-not (Test-Path "$PWD/manager/package.json")) { throw "Manager source reconstruction failed" }
          node bestiary-manager-v7-fix.cjs
          New-Item -ItemType Directory -Force "$PWD/manager/src/renderer/public" | Out-Null
          Copy-Item "$PWD/manager/resources/logo.png" "$PWD/manager/src/renderer/public/logo.png" -Force
          New-Item -ItemType Directory -Force "$PWD/manager/resources/gh" | Out-Null
          $gh = (Get-Command gh).Source
          Copy-Item $gh "$PWD/manager/resources/gh/gh.exe" -Force

      - name: Generate Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force manager/build | Out-Null
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path 'manager/resources/logo.png'))
          try {
            $bitmap = New-Object System.Drawing.Bitmap 512, 512
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $scale = [Math]::Min(440.0 / $source.Width, 440.0 / $source.Height)
                $w = [int]($source.Width * $scale); $h = [int]($source.Height * $scale)
                $graphics.DrawImage($source, [int]((512-$w)/2), [int]((512-$h)/2), $w, $h)
              } finally { $graphics.Dispose() }
              $bitmap.Save((Join-Path (Resolve-Path 'manager/build').Path 'icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bitmap.Dispose() }
          } finally { $source.Dispose() }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: manager
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: manager
        run: npm run typecheck

      - name: Build NSIS installer
        working-directory: manager
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-Item "$PWD/manager/release/BestiaryPackManager-Setup-7.0.0.exe"
          if ($installer.Length -lt 1000000) { throw "Installer is unexpectedly small" }
          New-Item -ItemType Directory -Force "$PWD/build-output" | Out-Null
          Copy-Item $installer.FullName "$PWD/build-output/BestiaryPackManager-Setup-7.0.0.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BestiaryPackManager-Setup-7.0.0.exe" | Set-Content -Encoding ascii "$PWD/build-output/BestiaryPackManager-Setup-7.0.0-SHA256.txt"

      - name: Smoke-test NSIS silent install
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD/build-output/BestiaryPackManager-Setup-7.0.0.exe" -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "NSIS silent install failed: $($proc.ExitCode)" }
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Bestiary Pack Manager.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed manager executable not found" }

      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryPackManager-Windows-7.0.0
          path: |
            build-output/BestiaryPackManager-Setup-7.0.0.exe
            build-output/BestiaryPackManager-Setup-7.0.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7
