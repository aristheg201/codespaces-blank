name: Build Bestiary Launcher 5.4.8 Modpacks (validation only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bestiary-launcher-modpack-manager-v548
    paths:
      - 'bestiary-v548/**'
      - '.github/workflows/build-bestiary-launcher-v548.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build launcher, run typecheck and Windows smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./bestiary-v548/build.ps1 *>&1 | Tee-Object -FilePath ci-v548.log
          if ($LASTEXITCODE -ne 0) { throw "Build exited $LASTEXITCODE" }
      - name: Upload test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-5.4.8-ModpackManager-TEST
          path: |
            build-output-v548/BestiaryLauncher-Setup-5.4.8.exe
            build-output-v548/BestiaryLauncher-Setup-5.4.8-SHA256.txt
            build-output-v548/feature-contract.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-548-diagnostics
          path: |
            ci-v548.log
            source/release/builder-debug.yml
          if-no-files-found: ignore
