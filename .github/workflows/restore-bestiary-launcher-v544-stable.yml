name: Restore Bestiary Launcher 5.4.4 Stable Asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-bestiary-launcher-v544-stable.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download original verified 5.4.4 artifact
        uses: actions/download-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.4.4
          path: publish
          repository: aristheg201/codespaces-blank
          run-id: 35351905665
          github-token: ${{ github.token }}

      - name: Verify original immutable payload
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find publish -type f -name 'BestiaryLauncher-Setup-5.4.4.exe' -print -quit)"
          HASHFILE="$(find publish -type f -name 'BestiaryLauncher-Setup-5.4.4-SHA256.txt' -print -quit)"
          test -n "$EXE" && test -s "$EXE"
          test -n "$HASHFILE" && test -s "$HASHFILE"
          ACTUAL="$(sha256sum "$EXE" | awk '{print $1}')"
          EXPECTED_FILE="$(tr -d '\r' < "$HASHFILE" | awk '{print tolower($1)}')"
          test "$EXPECTED_FILE" = "$ACTUAL"
          test "$ACTUAL" = '21036f2b640afce187ce1e8e97b1147a6f2a2e4d1e43e136fe05f799dd0723cd'
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "hashfile=$HASHFILE" >> "$GITHUB_OUTPUT"

      - name: Restore launcher-v5.4.4 to original verified asset
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.verify.outputs.exe }}
          HASHFILE: ${{ steps.verify.outputs.hashfile }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete launcher-v5.4.4 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create launcher-v5.4.4 "$EXE" "$HASHFILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bestiary Launcher 5.4.4" \
            --notes "Stable 5.4.4 asset restored to the original verified build so all cached updater feeds resolve to the same SHA-256. Minimum 3 GiB Minecraft heap; JVM profile 544; simplified Java 21 G1 tuning; legacy 539 migration; 5.4.3 lifecycle fixes preserved."
