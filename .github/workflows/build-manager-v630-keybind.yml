name: Build Bestiary Pack Manager 6.3.0 Keybinds

on:
  push:
    branches: [bestiary-manager-v6-3-0-mod-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct Manager 6.3.0 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force manager | Out-Null
          $parts=Get-ChildItem bpm6-src/part-*.txt|Sort-Object Name
          if($parts.Count -ne 9){throw "Expected 9 chunks, found $($parts.Count)"}
          $b64=($parts|ForEach-Object{Get-Content $_.FullName -Raw})-join ''
          [IO.File]::WriteAllBytes('manager-src.tar.gz',[Convert]::FromBase64String($b64))
          tar -xzf manager-src.tar.gz -C manager
          Copy-Item authfix-src/package.json manager/package.json -Force
          Copy-Item authfix-src/electron-builder.json manager/electron-builder.json -Force
          Copy-Item authfix-src/src/shared/types.ts manager/src/shared/types.ts -Force
          Copy-Item authfix-src/src/preload/index.ts manager/src/preload/index.ts -Force
          Copy-Item authfix-src/src/main/index.ts manager/src/main/index.ts -Force
          Copy-Item authfix-src/src/renderer/src/store.ts manager/src/renderer/src/store.ts -Force
          node authfix-src/patch-auth.cjs
          node patch-v602.cjs
          node patch-v603.cjs
          node patch-v604.cjs
          Copy-Item manager-v606/store.ts manager/src/renderer/src/store.ts -Force
          Copy-Item manager-v606/App.tsx manager/src/renderer/src/App.tsx -Force
          Copy-Item manager-v606/WorkspaceService.ts manager/src/main/services/WorkspaceService.ts -Force
          Copy-Item manager-v610/types.ts manager/src/shared/types.ts -Force
          Copy-Item manager-v610/preload-index.ts manager/src/preload/index.ts -Force
          Copy-Item manager-v610/AppUpdater.ts manager/src/main/services/AppUpdater.ts -Force
          node patch-v605.cjs
          node patch-v606.cjs
          node manager-v606/patch-main.cjs
          node manager-v610/patch-main.cjs
          node manager-v610/patch-ui.cjs
          node manager-v620/patch-v620.cjs
          Copy-Item manager-v630/types.ts manager/src/shared/types.ts -Force
          Copy-Item manager-v630/preload-index.ts manager/src/preload/index.ts -Force
          Copy-Item manager-v630/WorkspaceService.ts manager/src/main/services/WorkspaceService.ts -Force
          Copy-Item manager-v630/ModAuditService.ts manager/src/main/services/ModAuditService.ts -Force
          Copy-Item manager-v630/KeybindPolicyService.ts manager/src/main/services/KeybindPolicyService.ts -Force
          Copy-Item manager-v630/store.ts manager/src/renderer/src/store.ts -Force
          Copy-Item manager-v630/App.tsx manager/src/renderer/src/App.tsx -Force
          node manager-v630/patch-workspace-fixes.cjs
          node manager-v630/patch-main.cjs
          node manager-v630/patch-distribution.cjs
          node manager-v630/patch-ui-fixes.cjs
          node manager-v630/patch-keybind.cjs
          $pkg=Get-Content manager/package.json -Raw|ConvertFrom-Json
          $pkg.version='6.3.0';$pkg.author='SVFrame Team Studio';$pkg|ConvertTo-Json -Depth 20|Set-Content manager/package.json -Encoding UTF8
          New-Item -ItemType Directory -Force manager/src/renderer/public|Out-Null
          Copy-Item manager/resources/logo.png manager/src/renderer/public/logo.png -Force
          New-Item -ItemType Directory -Force manager/resources/gh|Out-Null
          Copy-Item (Get-Command gh).Source manager/resources/gh/gh.exe -Force
          New-Item -ItemType Directory -Force manager/build|Out-Null
          Copy-Item manager/resources/logo.png manager/build/icon.png -Force

      - name: Verify keybind and lifecycle contracts
        shell: pwsh
        run: |
          $types=Get-Content manager/src/shared/types.ts -Raw
          $keybind=Get-Content manager/src/main/services/KeybindPolicyService.ts -Raw
          $main=Get-Content manager/src/main/index.ts -Raw
          $app=Get-Content manager/src/renderer/src/App.tsx -Raw
          $dist=Get-Content manager/src/main/services/GithubDistributionService.ts -Raw
          if($types -notmatch 'KeybindRule' -or $types -notmatch 'KeybindPolicy'){throw 'Keybind types missing.'}
          if($keybind -notmatch 'bestiary-keybinds\.json' -or $keybind -notmatch 'options\.txt' -or $keybind -notmatch "mode: raw\.mode === 'locked'"){throw 'Keybind service contract missing.'}
          if($main -notmatch "keybind:get" -or $main -notmatch "keybind:save" -or $main -notmatch "keybind:import-options"){throw 'Keybind IPC missing.'}
          if($app -notmatch 'KEYBINDS' -or $app -notmatch 'ĐỌC OPTIONS\.TXT' -or $app -notmatch 'DEFAULT' -or $app -notmatch 'LOCKED' -or $app -notmatch 'CONFLICT'){throw 'Keybind UI missing.'}
          if($dist -notmatch "file\.path === 'config/bestiary-keybinds\.json'" -or $dist -notmatch "\['full','lite','android'\]"){throw 'Keybind distribution profile missing.'}
          if($main -notmatch 'app\.exit\(0\)' -or $main -notmatch "app\.on\('second-instance'"){throw 'Manager lifecycle hardening missing.'}

      - name: Install dependencies
        working-directory: manager
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: manager
        run: npm run typecheck
      - name: Build NSIS
        working-directory: manager
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer=Get-Item manager/release/BestiaryPackManager-Setup-6.3.0.exe -ErrorAction Stop
          if($installer.Length -lt 1000000){throw 'Installer too small.'}
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)"|Set-Content manager/release/BestiaryPackManager-Setup-6.3.0-SHA256.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryPackManager-Windows-6.3.0-keybind
          path: |
            manager/release/BestiaryPackManager-Setup-6.3.0.exe
            manager/release/BestiaryPackManager-Setup-6.3.0-SHA256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish verified keybind marker
        if: success() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line=Get-Content manager/release/BestiaryPackManager-Setup-6.3.0-SHA256.txt -Raw;$hash=($line -split '\s+')[0]
          $m=[ordered]@{version='6.3.0';sha256=$hash;sourceCommit=$env:GITHUB_SHA;branch=$env:GITHUB_REF_NAME;runId=$env:GITHUB_RUN_ID;modAuditVerified=$true;lifecycleVerified=$true;keybindManagerVerified=$true;verified=$true}|ConvertTo-Json -Depth 4
          $enc=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($m));$path='manager-v630/ci-keybind.json';$old=''
          gh api "repos/$env:GITHUB_REPOSITORY/contents/${path}?ref=$($env:GITHUB_REF_NAME)" --jq '.sha' 2>$null|ForEach-Object{$old=$_}
          $payload=@{message='Record verified Manager 6.3 keybind build [skip ci]';content=$enc;branch=$env:GITHUB_REF_NAME};if($old){$payload.sha=$old}
          ($payload|ConvertTo-Json -Compress)|gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/${path}" --input - *> $null
