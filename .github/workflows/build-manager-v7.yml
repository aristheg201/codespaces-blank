name: Build Bestiary Pack Manager 7.0.0

on:
  push:
    branches:
      - bestiary-manager-v7-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force manager | Out-Null
          $parts = Get-ChildItem "bestiary-manager-v7-final-source/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("$PWD/manager-src-7.0.0.tar.gz", [Convert]::FromBase64String($b64))
          tar -xzf "$PWD/manager-src-7.0.0.tar.gz" -C "$PWD/manager"
          if ($LASTEXITCODE -ne 0) { throw "Unable to extract manager source archive" }
          if (-not (Test-Path "$PWD/manager/package.json")) { throw "Manager source reconstruction failed" }

          New-Item -ItemType Directory -Force "$PWD/manager/src/renderer/public" | Out-Null
          Copy-Item "$PWD/manager/resources/logo.png" "$PWD/manager/src/renderer/public/logo.png" -Force

          New-Item -ItemType Directory -Force "$PWD/manager/resources/gh" | Out-Null
          $gh = (Get-Command gh).Source
          if (-not (Test-Path $gh)) { throw "GitHub CLI is missing on runner" }
          Copy-Item $gh "$PWD/manager/resources/gh/gh.exe" -Force

          Push-Location manager
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "7.0.0") { throw "Unexpected manager version $($pkg.version)" }
          if ($pkg.author -ne "SVFrame Team Studio") { throw "Unexpected manager author $($pkg.author)" }
          Pop-Location

      - name: Generate Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force manager/build | Out-Null
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path 'manager/resources/logo.png'))
          try {
            $bitmap = New-Object System.Drawing.Bitmap 512, 512
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                $scale = [Math]::Min(440.0 / $source.Width, 440.0 / $source.Height)
                $w = [int]($source.Width * $scale)
                $h = [int]($source.Height * $scale)
                $x = [int]((512 - $w) / 2)
                $y = [int]((512 - $h) / 2)
                $graphics.DrawImage($source, $x, $y, $w, $h)
              } finally { $graphics.Dispose() }
              $bitmap.Save((Join-Path (Resolve-Path 'manager/build').Path 'icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bitmap.Dispose() }
          } finally { $source.Dispose() }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: manager/package.json

      - name: Install dependencies
        working-directory: manager
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: manager
        shell: pwsh
        run: npm run typecheck

      - name: Build NSIS installer
        working-directory: manager
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-Item "$PWD/manager/release/BestiaryPackManager-Setup-7.0.0.exe"
          if ($installer.Length -lt 1000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force "$PWD/build-output" | Out-Null
          Copy-Item $installer.FullName "$PWD/build-output/BestiaryPackManager-Setup-7.0.0.exe" -Force
          "$hash  BestiaryPackManager-Setup-7.0.0.exe" | Set-Content -Encoding ascii "$PWD/build-output/BestiaryPackManager-Setup-7.0.0-SHA256.txt"

      - name: Smoke-test NSIS silent install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$PWD/build-output/BestiaryPackManager-Setup-7.0.0.exe"
          $proc = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "NSIS silent install exited with code $($proc.ExitCode)" }
          Start-Sleep -Seconds 2
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Bestiary Pack Manager.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Bestiary Pack Manager executable was not found" }
          if ($installed.Length -lt 1000000) { throw "Installed manager executable is unexpectedly small" }

      - name: Upload verified installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryPackManager-Windows-7.0.0
          path: |
            build-output/BestiaryPackManager-Setup-7.0.0.exe
            build-output/BestiaryPackManager-Setup-7.0.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7
