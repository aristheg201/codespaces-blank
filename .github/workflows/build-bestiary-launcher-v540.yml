name: Build Bestiary Launcher 5.4.0

on:
  push:
    branches: [bestiary-launcher-v5-4-0-approved-msa]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 160
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify Launcher 5.4.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try {
            & ./bestiary-v540/build.ps1 *>&1 | Tee-Object -FilePath ci-v540.log
            if($LASTEXITCODE -ne 0){throw "5.4.0 build returned $LASTEXITCODE"}
          } catch {
            $_ | Out-String | Tee-Object -FilePath ci-v540.log -Append
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.4.0
          path: |
            build-output-v540/BestiaryLauncher-Setup-5.4.0.exe
            build-output-v540/BestiaryLauncher-Setup-5.4.0-SHA256.txt
            build-output-v540/runtime-smoke-stdout.log
            build-output-v540/runtime-smoke-stderr.log
          if-no-files-found: error
          retention-days: 7
      - name: Publish CI failure marker
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail=if(Test-Path ci-v540.log){(Get-Content ci-v540.log -Tail 400)-join "`n"}else{'No build log.'}
          $text="run=$env:GITHUB_RUN_ID`ncommit=$env:GITHUB_SHA`nbranch=$env:GITHUB_REF_NAME`n`n$tail"
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $path='bestiary-v540/ci-failure.txt';$existing=''
          gh api "repos/$env:GITHUB_REPOSITORY/contents/${path}?ref=$($env:GITHUB_REF_NAME)" --jq '.sha' 2>$null|ForEach-Object{$existing=$_}
          $payload=@{message='Record Launcher 5.4.0 CI failure [skip ci]';content=$encoded;branch=$env:GITHUB_REF_NAME};if($existing){$payload.sha=$existing}
          ($payload|ConvertTo-Json -Compress)|gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/${path}" --input - *> $null

  publish-release:
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.4.0
          path: publish
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s publish/BestiaryLauncher-Setup-5.4.0.exe
          test -s publish/BestiaryLauncher-Setup-5.4.0-SHA256.txt
          EXPECTED="$(awk '{print $1}' publish/BestiaryLauncher-Setup-5.4.0-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(sha256sum publish/BestiaryLauncher-Setup-5.4.0.exe | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
      - name: Publish Launcher 5.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='launcher-v5.4.0'
          NOTES='Mojang has approved the Bestiary Launcher Application ID for Java Edition Game Services. Microsoft mode now defaults to the direct Bestiary authentication flow: Device Code OAuth with XboxLive.signin/offline_access, Xbox Live + XSTS exchange, Minecraft Java entitlement verification, profile retrieval, and authenticated game launch. Existing identity-only Microsoft sessions from pre-approval builds must sign in again once to grant the game scope. Local/offline mode remains separate. Adaptive JVM, lifecycle, keybind, updater, client sync, and runtime settings behavior from 5.3.9 are retained.'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Bestiary Launcher 5.4.0' --notes "$NOTES"
          fi
          gh release upload "$TAG" publish/BestiaryLauncher-Setup-5.4.0.exe publish/BestiaryLauncher-Setup-5.4.0-SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish verified build marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(awk '{print $1}' publish/BestiaryLauncher-Setup-5.4.0-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          python - "$HASH" <<'PY' > /tmp/marker.json
          import json, os, sys
          print(json.dumps({
            'version':'5.4.0',
            'sha256':sys.argv[1],
            'sourceCommit':os.environ['GITHUB_SHA'],
            'branch':os.environ['GITHUB_REF_NAME'],
            'runId':int(os.environ['GITHUB_RUN_ID']),
            'mojangAppIdApproved':True,
            'microsoftDirectLaunchDefault':True,
            'xboxLiveScopeVerified':True,
            'xstsFlowVerified':True,
            'minecraftEntitlementVerified':True,
            'minecraftProfileFlowVerified':True,
            'adaptiveJvmRetained':True,
            'runtimeSmokeVerified':True,
            'releasePublished':True,
            'verified':True,
          }, ensure_ascii=False, indent=2))
          PY
          CONTENT="$(base64 -w0 /tmp/marker.json)"
          P='bestiary-v540/ci-build.json'
          OLD="$(gh api "repos/$GITHUB_REPOSITORY/contents/${P}?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)"
          python - "$CONTENT" "$OLD" <<'PY' > /tmp/payload.json
          import json, os, sys
          payload={'message':'Record verified Launcher 5.4.0 approved MSA build [skip ci]','content':sys.argv[1],'branch':os.environ['GITHUB_REF_NAME']}
          if sys.argv[2]: payload['sha']=sys.argv[2]
          print(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/${P}" --input /tmp/payload.json >/dev/null
