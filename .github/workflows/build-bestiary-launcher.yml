name: Build Bestiary Launcher 5.1.0

on:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct Bestiary Launcher 5.1.0 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import base64, pathlib, tarfile, io, shutil

          root = pathlib.Path('bestiary-v510-final/source')
          candidates = [
              ['part-00.txt','part-01a1-0.txt','part-01b.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'],
              ['part-00.txt','part-01a1.txt','part-01a2.txt','part-01b.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'],
          ]
          out = pathlib.Path('source')
          out.mkdir(exist_ok=True)
          errors = []
          for i, names in enumerate(candidates, 1):
              try:
                  text = ''.join((root / n).read_text(encoding='utf-8').strip() for n in names)
                  text += '=' * ((4 - len(text) % 4) % 4)
                  packed = base64.b64decode(text, validate=True)
                  with tarfile.open(fileobj=io.BytesIO(packed), mode='r:gz') as tf:
                      members = tf.getmembers()
                      if not any(m.name.endswith('package.json') for m in members):
                          raise RuntimeError('package.json not found in archive')
                      print(f'using source candidate {i}: {names}; encoded={len(text)} packed={len(packed)} members={len(members)}')
                      tf.extractall(out)
                  break
              except Exception as exc:
                  errors.append(f'candidate {i}: {exc!r}')
                  for child in list(out.iterdir()):
                      shutil.rmtree(child) if child.is_dir() else child.unlink()
          else:
              raise SystemExit('No valid 5.1.0 source candidate. ' + ' | '.join(errors))
          '@ | Set-Content -Encoding UTF8 reconstruct.py
          python reconstruct.py
          if ($LASTEXITCODE -ne 0) { throw "Unable to reconstruct Bestiary Launcher 5.1.0 source" }
          if (-not (Test-Path "$PWD/source/package.json")) { throw "Launcher source reconstruction did not produce package.json" }

          Copy-Item "bestiary-build/installer.nsh" "$PWD/source/build/installer.nsh" -Force
          $logoPartNames = @("logo5-00a","logo5-00b","logo5-01a","logo5-01b","logo5-02","logo5-03","logo5-04a","logo5-04b")
          $logoB64 = ($logoPartNames | ForEach-Object { (Get-Content "bestiary-build/$_" -Raw).Trim() }) -join ""
          New-Item -ItemType Directory -Force "$PWD/source/resources" | Out-Null
          New-Item -ItemType Directory -Force "$PWD/source/src/renderer/public" | Out-Null
          [IO.File]::WriteAllBytes("$PWD/source/resources/logo.png", [Convert]::FromBase64String($logoB64))
          Copy-Item "$PWD/source/resources/logo.png" "$PWD/source/src/renderer/public/logo.png" -Force

          Push-Location source
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "5.1.0") { throw "Unexpected launcher version $($pkg.version)" }
          if ($pkg.author -ne "SVFrame Team Studio") { throw "Unexpected launcher author $($pkg.author)" }
          Pop-Location

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          @'
          from PIL import Image
          from pathlib import Path
          root = Path('source')
          src = Image.open(root/'resources'/'logo.png').convert('RGBA')
          canvas = Image.new('RGBA',(256,256),(0,0,0,0))
          src.thumbnail((230,150),Image.Resampling.LANCZOS)
          canvas.alpha_composite(src,((256-src.width)//2,(256-src.height)//2))
          (root/'build').mkdir(parents=True,exist_ok=True)
          canvas.save(root/'resources'/'icon.png')
          canvas.save(root/'build'/'icon.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)])
          '@ | Set-Content -Encoding UTF8 create_icon.py
          python create_icon.py

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: source
        run: npm run typecheck
      - name: Build NSIS installer
        working-directory: source
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "$PWD/source/release" -Filter "BestiaryLauncher-Setup-5.1.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not produced" }
          if ($installer.Length -lt 1000000) { throw "Installer unexpectedly small: $($installer.Length)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force "$PWD/build-output" | Out-Null
          Copy-Item $installer.FullName "$PWD/build-output/BestiaryLauncher-Setup-5.1.0.exe" -Force
          "$hash  BestiaryLauncher-Setup-5.1.0.exe" | Set-Content -Encoding ascii "$PWD/build-output/BestiaryLauncher-Setup-5.1.0-SHA256.txt"

      - name: Smoke-test NSIS silent install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Start-Process -FilePath "$PWD/build-output/BestiaryLauncher-Setup-5.1.0.exe" -ArgumentList "/S" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "NSIS silent install exited with code $($proc.ExitCode)" }
          Start-Sleep -Seconds 2
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Bestiary Launcher.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Installed Bestiary Launcher executable not found" }
          if ($installed.Length -lt 1000000) { throw "Installed launcher executable unexpectedly small" }
          Copy-Item $installed.FullName "$PWD/build-output/Bestiary Launcher.exe" -Force
          $installedHash = (Get-FileHash $installed.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installedHash  Bestiary Launcher.exe" | Set-Content -Encoding ascii "$PWD/build-output/BestiaryLauncher-5.1.0-EXE-SHA256.txt"

      - name: Upload verified launcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.1.0
          path: |
            build-output/BestiaryLauncher-Setup-5.1.0.exe
            build-output/BestiaryLauncher-Setup-5.1.0-SHA256.txt
            build-output/Bestiary Launcher.exe
            build-output/BestiaryLauncher-5.1.0-EXE-SHA256.txt
          if-no-files-found: error
          retention-days: 7
