name: Build Bestiary Launcher 5.3.3

on:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and runtime-test Launcher 5.3.3
        shell: pwsh
        run: ./bestiary-v533/build.ps1

      - name: Upload runtime-verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.3.3
          path: |
            build-output-v533/BestiaryLauncher-Setup-5.3.3.exe
            build-output-v533/BestiaryLauncher-Setup-5.3.3-SHA256.txt
            build-output-v533/BestiaryLauncher-Portable-5.3.3.zip
            build-output-v533/BestiaryLauncher-Portable-5.3.3-SHA256.txt
            build-output-v533/bestiary-skin-bridge-1.0.0.jar
            build-output-v533/bestiary-skin-bridge-1.0.0-SHA256.txt
            build-output-v533/runtime-smoke-stdout.log
            build-output-v533/runtime-smoke-stderr.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish durable Launcher release assets
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'launcher-v5.3.3'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'Bestiary Launcher 5.3.3' --notes 'Clarifies server-local/offline identity as separate from Microsoft and Java Edition Game Service APIs. Removes crack terminology from player-facing UI while preserving Microsoft entitlement verification, skin management, 5.3.2 fresh remote refresh, lifecycle fixes and SHA-verified auto updater.'
          }
          gh release upload $tag build-output-v533/BestiaryLauncher-Setup-5.3.3.exe build-output-v533/BestiaryLauncher-Setup-5.3.3-SHA256.txt build-output-v533/BestiaryLauncher-Portable-5.3.3.zip build-output-v533/BestiaryLauncher-Portable-5.3.3-SHA256.txt build-output-v533/bestiary-skin-bridge-1.0.0.jar build-output-v533/bestiary-skin-bridge-1.0.0-SHA256.txt --clobber
