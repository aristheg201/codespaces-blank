name: Build Bestiary Launcher 5.2.0

on:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, verify Content UX, updater, and runtime-smoke-test Launcher 5.2.0
        shell: pwsh
        run: ./bestiary-v520/build.ps1

      - name: Upload runtime-verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.2.0
          path: |
            build-output-v520/BestiaryLauncher-Setup-5.2.0.exe
            build-output-v520/BestiaryLauncher-Setup-5.2.0-SHA256.txt
            build-output-v520/BestiaryLauncher-Portable-5.2.0.zip
            build-output-v520/BestiaryLauncher-Portable-5.2.0-SHA256.txt
            build-output-v520/runtime-smoke-stdout.log
            build-output-v520/runtime-smoke-stderr.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish durable Launcher release assets
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'launcher-v5.2.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'Bestiary Launcher 5.2.0' --notes 'Bestiary Launcher 5.2.0: primary Content Manager screen and SHA-256 verified application updater.'
          }
          gh release upload $tag build-output-v520/BestiaryLauncher-Setup-5.2.0.exe build-output-v520/BestiaryLauncher-Setup-5.2.0-SHA256.txt build-output-v520/BestiaryLauncher-Portable-5.2.0.zip build-output-v520/BestiaryLauncher-Portable-5.2.0-SHA256.txt --clobber
