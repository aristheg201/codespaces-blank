name: Build Bestiary Launcher 5.0.0

on:
  push:
    branches:
      - bestiary-installer-5-0-0
    paths:
      - "bestiary-build/**"
      - ".github/workflows/build-bestiary-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: bestiary-installer-5-0-0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct source and assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force source | Out-Null

          $sourceParts = Get-ChildItem "bestiary-build/src5-*" | Sort-Object Name
          if ($sourceParts.Count -ne 6) { throw "Expected 6 source chunks, got $($sourceParts.Count)" }
          $sourceB64 = ($sourceParts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("$PWD/source.tar.gz", [Convert]::FromBase64String($sourceB64))
          tar -xzf "$PWD/source.tar.gz" -C "$PWD/source"

          $logoParts = Get-ChildItem "bestiary-build/logo5-*" | Sort-Object Name
          if ($logoParts.Count -ne 5) { throw "Expected 5 logo chunks, got $($logoParts.Count)" }
          $logoB64 = ($logoParts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""

          New-Item -ItemType Directory -Force "$PWD/source/resources" | Out-Null
          New-Item -ItemType Directory -Force "$PWD/source/src/renderer/public" | Out-Null
          [IO.File]::WriteAllBytes("$PWD/source/resources/logo.png", [Convert]::FromBase64String($logoB64))
          Copy-Item "$PWD/source/resources/logo.png" "$PWD/source/src/renderer/public/logo.png" -Force

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          @'
          from PIL import Image
          from pathlib import Path

          root = Path("source")
          src = Image.open(root / "resources" / "logo.png").convert("RGBA")
          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          src.thumbnail((230, 150), Image.Resampling.LANCZOS)
          x = (256 - src.width) // 2
          y = (256 - src.height) // 2
          canvas.alpha_composite(src, (x, y))
          (root / "build").mkdir(parents=True, exist_ok=True)
          canvas.save(root / "resources" / "icon.png")
          canvas.save(
              root / "build" / "icon.ico",
              format="ICO",
              sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)],
          )
          '@ | Set-Content -Encoding UTF8 create_icon.py
          python create_icon.py

      - name: Install dependencies
        working-directory: source
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer
        working-directory: source
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "$PWD/source/release" -Filter "BestiaryLauncher-Setup-5.0.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not produced" }
          if ($installer.Length -lt 1000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force "$PWD/build-output" | Out-Null
          Copy-Item $installer.FullName "$PWD/build-output/BestiaryLauncher-Setup-5.0.0.exe" -Force
          "$hash  BestiaryLauncher-Setup-5.0.0.exe" | Set-Content -Encoding ascii "$PWD/build-output/SHA256SUMS.txt"
          Get-Item "$PWD/build-output/BestiaryLauncher-Setup-5.0.0.exe" | Format-List Name,Length,FullName
          Get-Content "$PWD/build-output/SHA256SUMS.txt"

      - name: Publish build release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "bestiary-launcher-v5.0.0-build"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Unable to remove previous build release" }
          }
          gh release create $tag `
            "build-output/BestiaryLauncher-Setup-5.0.0.exe" `
            "build-output/SHA256SUMS.txt" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Bestiary Launcher 5.0.0 Build" `
            --notes "Automated Windows x64 NSIS build."
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish build release" }
