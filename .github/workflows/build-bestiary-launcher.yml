name: Build Bestiary Launcher 5.1.3

on:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and runtime-smoke-test Launcher 5.1.3
        shell: pwsh
        run: ./bestiary-v513/build.ps1

      - name: Upload runtime-verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.1.3
          path: |
            build-output-v513/BestiaryLauncher-Setup-5.1.3.exe
            build-output-v513/BestiaryLauncher-Setup-5.1.3-SHA256.txt
            build-output-v513/BestiaryLauncher-Portable-5.1.3.zip
            build-output-v513/BestiaryLauncher-Portable-5.1.3-SHA256.txt
            build-output-v513/runtime-smoke-stdout.log
            build-output-v513/runtime-smoke-stderr.log
          if-no-files-found: error
          retention-days: 7
