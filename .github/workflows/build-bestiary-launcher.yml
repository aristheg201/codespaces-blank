name: Build Bestiary Launcher 5.1.4

on:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Launcher 5.1.4 build script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content './bestiary-v513/build.ps1' -Raw
          $source = $source.Replace('5.1.3', '5.1.4').Replace('build-output-v513', 'build-output-v514')
          $needle = "Copy-Item 'bestiary-v510-final/fixes/Home.css' `"$PWD/source/src/renderer/src/components/Home.css`" -Force"
          if (-not $source.Contains($needle)) { throw 'Home.css copy marker missing in runtime-verified build script.' }
          $extra = @"
$needle
Copy-Item 'bestiary-v510-final/fixes/UxPanels.css' `"`$PWD/source/src/renderer/src/components/UxPanels.css`" -Force
Copy-Item 'bestiary-v510-final/fixes/DiscordText.tsx' `"`$PWD/source/src/renderer/src/components/DiscordText.tsx`" -Force
Copy-Item 'bestiary-v510-final/fixes/AnnouncementModal.tsx' `"`$PWD/source/src/renderer/src/components/AnnouncementModal.tsx`" -Force
"@
          $source = $source.Replace($needle, $extra.TrimEnd())
          Set-Content './bestiary-v513/build-v514.ps1' $source -Encoding UTF8

      - name: Build and runtime-smoke-test Launcher 5.1.4
        shell: pwsh
        run: ./bestiary-v513/build-v514.ps1

      - name: Verify guided UX bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Get-Content 'source/src/renderer/src/components/ProfileChooser.tsx' -Raw
          $settings = Get-Content 'source/src/renderer/src/components/SettingsModal.tsx' -Raw
          $announcement = Get-Content 'source/src/renderer/src/components/AnnouncementModal.tsx' -Raw
          $discord = Get-Content 'source/src/renderer/src/components/DiscordText.tsx' -Raw
          if ($profile -notmatch 'KHUYÊN DÙNG' -or $profile -notmatch 'CHỌN FULL & TIẾP TỤC') { throw 'Guided Full/Lite chooser missing.' }
          if ($settings -notmatch 'Hiệu năng' -or $settings -notmatch 'Nâng cao' -or $settings -notmatch 'GENERATE JVM FLAGS') { throw 'Guided settings navigation missing.' }
          if ($announcement -notmatch 'DiscordText') { throw 'Discord announcement renderer is not wired.' }
          if ($discord -notmatch 'blockquote' -or $discord -notmatch 'discord-codeblock') { throw 'Discord formatting support is incomplete.' }
          Write-Host 'Guided launcher UX contract verified.'

      - name: Upload runtime-verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.1.4
          path: |
            build-output-v514/BestiaryLauncher-Setup-5.1.4.exe
            build-output-v514/BestiaryLauncher-Setup-5.1.4-SHA256.txt
            build-output-v514/BestiaryLauncher-Portable-5.1.4.zip
            build-output-v514/BestiaryLauncher-Portable-5.1.4-SHA256.txt
            build-output-v514/runtime-smoke-stdout.log
            build-output-v514/runtime-smoke-stderr.log
          if-no-files-found: error
          retention-days: 7
