name: Debug Launcher 5.1.0 Source

on:
  workflow_dispatch:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect launcher wiring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          python - <<'PY'
          import base64, pathlib, tarfile, io
          b=pathlib.Path('bestiary-build'); bn=['src5-00','src5-01','src5-02','src5-03a','src5-03b','src5-04','src5-05']
          s=''.join((b/n).read_text().strip() for n in bn)
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(s)),mode='r:gz') as tf: tf.extractall('source')
          r=pathlib.Path('bestiary-v510-final/source'); nn=['part-00.txt','part-01a1.txt','part-01a2.txt','part-01b.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt']
          t=''.join((r/n).read_text().strip() for n in nn); t += '='*((4-len(t)%4)%4)
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(t)),mode='r:gz') as tf: tf.extractall('source')
          PY
          for f in \
            source/src/main/index.ts \
            source/src/preload/index.ts \
            source/src/main/core/SettingsStore.ts \
            source/src/main/core/SyncEngine.ts \
            source/src/main/core/Launcher.ts \
            source/src/renderer/src/components/SettingsModal.tsx \
            source/src/renderer/src/components/Home.tsx \
            source/src/renderer/src/App.tsx \
            source/src/renderer/src/store/launcherStore.ts; do
            echo "=== $f ==="; nl -ba "$f" | sed -n '1,360p';
          done
