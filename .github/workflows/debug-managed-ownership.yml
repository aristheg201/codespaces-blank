name: Debug Launcher 5.1.0 Runtime Source

on:
  workflow_dispatch:
  push:
    branches: [bestiary-launcher-v5-1-0]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover runtime files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, pathlib, zlib
          root=pathlib.Path('bestiary-v510/overlay')
          names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt']
          text=''.join((root/n).read_text().strip() for n in names); text += '='*((4-len(text)%4)%4)
          d=zlib.decompressobj(16+zlib.MAX_WBITS); raw=d.decompress(base64.b64decode(text))
          targets={
            'src/main/index.ts',
            'src/main/core/RemoteService.ts',
            'src/main/core/Launcher.ts',
            'src/main/core/SettingsStore.ts',
            'src/main/core/SyncEngine.ts',
            'src/shared/constants.ts',
            'src/shared/ipc.ts',
          }
          out=pathlib.Path('runtime-source')
          start=0
          found=set()
          while True:
              p=raw.find(b'ustar',start)
              if p<0: break
              h0=p-257; start=p+5
              if h0<0 or h0+512>len(raw): continue
              h=raw[h0:h0+512]
              name=h[:100].split(b'\0',1)[0].decode('utf-8','replace')
              prefix=h[345:500].split(b'\0',1)[0].decode('utf-8','replace')
              if prefix: name=prefix+'/'+name
              try: size=int(h[124:136].split(b'\0',1)[0].strip() or b'0',8)
              except: continue
              data0=h0+512
              if name in targets and data0+size<=len(raw):
                  found.add(name)
                  target=out/name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw[data0:data0+size])
          missing=targets-found
          if missing: raise SystemExit('Missing: '+', '.join(sorted(missing)))
          PY
      - name: Upload runtime source
        uses: actions/upload-artifact@v4
        with:
          name: launcher-runtime-source
          path: runtime-source
          if-no-files-found: error
          retention-days: 1
