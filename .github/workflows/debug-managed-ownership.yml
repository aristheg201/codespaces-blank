name: Debug Launcher 5.1.0 Source

on:
  workflow_dispatch:
  push:
    branches: [bestiary-launcher-v5-1-0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print recoverable 5.1.0 core files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, pathlib, zlib
          root=pathlib.Path('bestiary-v510/overlay')
          names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt']
          text=''.join((root/n).read_text().strip() for n in names); text += '='*((4-len(text)%4)%4)
          d=zlib.decompressobj(16+zlib.MAX_WBITS); raw=d.decompress(base64.b64decode(text))
          targets={'src/main/core/JvmProfileGenerator.ts','src/main/core/ContentManager.ts','src/main/core/RemoteService.ts','src/renderer/src/components/LibraryModal.tsx','src/shared/ipc.ts'}
          start=0
          while True:
              p=raw.find(b'ustar',start)
              if p<0: break
              h0=p-257; start=p+5
              if h0<0 or h0+512>len(raw): continue
              h=raw[h0:h0+512]
              name=h[:100].split(b'\0',1)[0].decode('utf-8','replace')
              prefix=h[345:500].split(b'\0',1)[0].decode('utf-8','replace')
              if prefix: name=prefix+'/'+name
              try: size=int(h[124:136].split(b'\0',1)[0].strip() or b'0',8)
              except: continue
              data0=h0+512
              if name in targets and data0+size<=len(raw):
                  print('===',name,'===')
                  print(raw[data0:data0+size].decode('utf-8','replace'))
          PY
