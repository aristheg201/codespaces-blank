name: Debug Manager 6.0.3 Source

on:
  workflow_dispatch:
  push:
    branches: [bestiary-manager-v7-final]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and print targeted manager files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manager
          cat bpm6-src/part-*.txt | base64 -d > manager-src.tar.gz
          tar -xzf manager-src.tar.gz -C manager
          cp authfix-src/package.json manager/package.json
          cp authfix-src/electron-builder.json manager/electron-builder.json
          cp authfix-src/src/shared/types.ts manager/src/shared/types.ts
          cp authfix-src/src/preload/index.ts manager/src/preload/index.ts
          cp authfix-src/src/main/index.ts manager/src/main/index.ts
          cp authfix-src/src/renderer/src/store.ts manager/src/renderer/src/store.ts
          node authfix-src/patch-auth.cjs
          node patch-v602.cjs
          for f in manager/src/renderer/src/App.tsx manager/src/main/services/GithubDistributionService.ts manager/src/main/services/SettingsService.ts manager/electron-builder.json manager/package.json; do
            echo "===== $f ====="
            cat "$f"
          done
