name: Build Bestiary Pack Manager 6.0.5 Windows

on:
  push:
    branches: [bestiary-manager-v7-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct Manager 6.0.5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force manager | Out-Null
          $parts = Get-ChildItem bpm6-src/part-*.txt | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('manager-src.tar.gz', [Convert]::FromBase64String($b64))
          tar -xzf manager-src.tar.gz -C manager
          if (-not (Test-Path manager/package.json)) { throw 'Manager source reconstruction failed.' }

          Copy-Item authfix-src/package.json manager/package.json -Force
          Copy-Item authfix-src/electron-builder.json manager/electron-builder.json -Force
          Copy-Item authfix-src/src/shared/types.ts manager/src/shared/types.ts -Force
          Copy-Item authfix-src/src/preload/index.ts manager/src/preload/index.ts -Force
          Copy-Item authfix-src/src/main/index.ts manager/src/main/index.ts -Force
          Copy-Item authfix-src/src/renderer/src/store.ts manager/src/renderer/src/store.ts -Force
          node authfix-src/patch-auth.cjs
          node patch-v602.cjs
          node patch-v603.cjs
          node patch-v604.cjs

          @'
          from pathlib import Path
          import base64, gzip, hashlib
          chunks = sorted(Path('manager-v605/chunks').glob('*.txt'))
          if len(chunks) != 5:
              raise SystemExit(f'Expected 5 Manager UX source chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          digest = hashlib.sha256(encoded.encode()).hexdigest()
          expected = '4d0aab9b48adad6e70afc199327ffa3f642cd70c20311909d303953167880e9c'
          if digest != expected:
              raise SystemExit(f'Manager UX source checksum mismatch: {digest}')
          data = gzip.decompress(base64.b64decode(encoded))
          Path('manager/src/renderer/src/App.tsx').write_bytes(data)
          print('Manager UX source restored:', len(data), 'bytes')
          '@ | Set-Content -Encoding UTF8 decode_manager_v605.py
          python decode_manager_v605.py
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore Manager 6.0.5 renderer source.' }

          $pkg = Get-Content manager/package.json -Raw | ConvertFrom-Json
          $pkg.version = '6.0.5'
          $pkg.author = @{ name = 'SVFrame Team Studio' }
          $pkg.description = 'Bestiary Pack Manager'
          $pkg | ConvertTo-Json -Depth 20 | Set-Content manager/package.json -Encoding UTF8

          New-Item -ItemType Directory -Force manager/src/renderer/public | Out-Null
          Copy-Item manager/resources/logo.png manager/src/renderer/public/logo.png -Force
          New-Item -ItemType Directory -Force manager/resources/gh | Out-Null
          Copy-Item (Get-Command gh).Source manager/resources/gh/gh.exe -Force

          New-Item -ItemType Directory -Force manager/build | Out-Null
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path 'manager/resources/logo.png'))
          try {
            $bitmap = New-Object System.Drawing.Bitmap 512, 512
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                $scale = [Math]::Min(440.0 / $source.Width, 440.0 / $source.Height)
                $w = [int]($source.Width * $scale)
                $h = [int]($source.Height * $scale)
                $graphics.DrawImage($source, [int]((512-$w)/2), [int]((512-$h)/2), $w, $h)
              } finally { $graphics.Dispose() }
              $bitmap.Save((Join-Path (Resolve-Path 'manager/build').Path 'icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bitmap.Dispose() }
          } finally { $source.Dispose() }

      - name: Verify guided Manager UX source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-Content manager/src/renderer/src/App.tsx -Raw
          $types = Get-Content manager/src/shared/types.ts -Raw
          $service = Get-Content manager/src/main/services/GithubDistributionService.ts -Raw
          if ($app -notmatch 'BƯỚC 2 • RELEASE' -or $app -notmatch 'PRE-FLIGHT CHECK') { throw 'Release pre-flight UX is missing.' }
          if ($app -notmatch 'Distribution' -or $app -notmatch 'Máy chủ' -or $app -notmatch 'Runtime' -or $app -notmatch 'Thông báo') { throw 'Guided settings sections are missing.' }
          if ($app -notmatch 'ManagerDiscordPreview' -or $app -notmatch 'PREVIEW DISCORD / LAUNCHER') { throw 'Discord-style announcement preview is missing.' }
          if ($types -notmatch 'fabricLoaderVersion' -or $service -notmatch 'loaderVersion: this\.settings\.fabricLoaderVersion') { throw 'Pinned runtime contract was lost.' }
          Write-Host 'Guided Manager UX and runtime contracts verified.'

      - name: Install dependencies
        working-directory: manager
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: manager
        shell: pwsh
        run: npm run typecheck

      - name: Build NSIS installer
        working-directory: manager
        shell: pwsh
        run: npm run dist:win

      - name: Runtime smoke test and stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item manager/release/BestiaryPackManager-Setup-6.0.5.exe -ErrorAction Stop
          $unpacked = Resolve-Path manager/release/win-unpacked
          $exe = Get-Item (Join-Path $unpacked 'Bestiary Pack Manager.exe') -ErrorAction Stop
          if ($installer.Length -lt 1000000) { throw "Installer unexpectedly small: $($installer.Length)" }
          if (-not (Test-Path (Join-Path $unpacked 'resources/app.asar'))) { throw 'Manager runtime is missing app.asar.' }

          $stdout = "$PWD/manager-smoke-stdout.log"
          $stderr = "$PWD/manager-smoke-stderr.log"
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $unpacked -ArgumentList @('--enable-logging','--disable-gpu') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            Write-Host "Manager exited during smoke test with code $($proc.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout -Tail 200 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 200 }
            throw 'Manager failed runtime smoke test.'
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process | Where-Object { $_.ProcessName -like 'Bestiary*' } | Stop-Process -Force -ErrorAction SilentlyContinue

          $pkg = Get-Content manager/package.json -Raw | ConvertFrom-Json
          if ($pkg.author.name -ne 'SVFrame Team Studio') { throw 'Publisher metadata is not SVFrame Team Studio.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content manager/release/BestiaryPackManager-Setup-6.0.5-SHA256.txt -Encoding ascii
          Copy-Item $stdout manager/release/manager-smoke-stdout.log -Force -ErrorAction SilentlyContinue
          Copy-Item $stderr manager/release/manager-smoke-stderr.log -Force -ErrorAction SilentlyContinue
          Write-Host "Manager installer SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryPackManager-Windows-6.0.5
          path: |
            manager/release/BestiaryPackManager-Setup-6.0.5.exe
            manager/release/BestiaryPackManager-Setup-6.0.5-SHA256.txt
            manager/release/manager-smoke-stdout.log
            manager/release/manager-smoke-stderr.log
          if-no-files-found: error
          retention-days: 7
