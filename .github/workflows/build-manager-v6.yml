name: Build Bestiary Pack Manager v6 Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force manager | Out-Null
          $parts = Get-ChildItem bpm6-src/part-*.txt | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('manager-src.tar.gz', [Convert]::FromBase64String($b64))
          tar -xzf manager-src.tar.gz -C manager
          if (-not (Test-Path manager/package.json)) { throw 'Manager source reconstruction failed.' }
          New-Item -ItemType Directory -Force manager/src/renderer/public | Out-Null
          Copy-Item manager/resources/logo.png manager/src/renderer/public/logo.png -Force
          New-Item -ItemType Directory -Force manager/resources/gh | Out-Null
          Copy-Item (Get-Command gh).Source manager/resources/gh/gh.exe -Force

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: manager/package.json

      - name: Install dependencies
        working-directory: manager
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: manager
        shell: pwsh
        run: npm run typecheck

      - name: Build NSIS installer
        working-directory: manager
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Create SHA256
        shell: pwsh
        run: |
          $exe = Get-Item manager/release/BestiaryPackManager-Setup-6.0.0.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content manager/release/BestiaryPackManager-Setup-6.0.0-SHA256.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryPackManager-Windows-6.0.0
          path: |
            manager/release/BestiaryPackManager-Setup-6.0.0.exe
            manager/release/BestiaryPackManager-Setup-6.0.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7
