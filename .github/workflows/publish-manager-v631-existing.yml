name: Publish verified Bestiary Pack Manager 6.3.1

on:
  push:
    branches: [bestiary-manager-v6-3-1-keybind-autoscan]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publish
          gh run download 32374027823 --repo "$GITHUB_REPOSITORY" -n BestiaryPackManager-Windows-6.3.1 -D publish
          test -s publish/BestiaryPackManager-Setup-6.3.1.exe
          ACTUAL="$(sha256sum publish/BestiaryPackManager-Setup-6.3.1.exe | awk '{print $1}')"
          test "$ACTUAL" = '88953360b35da2afeb43585ac0fec66f9314663efaf9400f8857c089e2df186e'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='manager-v6.3.1'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Bestiary Pack Manager 6.3.1' --notes 'Manager 6.3.1: tự đọc keybind từ options.txt, giữ DEFAULT/LOCKED và không đè các option Minecraft không liên quan.'
          fi
          gh release upload "$TAG" publish/BestiaryPackManager-Setup-6.3.1.exe publish/BestiaryPackManager-Setup-6.3.1-SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
