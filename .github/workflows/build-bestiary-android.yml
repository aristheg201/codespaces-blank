name: Build Bestiary Launcher Android 1.0.4

on:
  push:
    branches: [bestiary-android-v1-0-4-performance-updater]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AMETHYST_COMMIT: 360d708262ff703d9b52782d20cd348410a33df5
      ANDROID_NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Bestiary Skin Bridge source
        uses: actions/checkout@v4
        with:
          ref: bestiary-launcher-v5-1-0
          path: skin-source
          sparse-checkout: bestiary-skin-bridge
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build Skin Bridge
        working-directory: skin-source/bestiary-skin-bridge
        run: |
          set -euo pipefail
          gradle build --stacktrace
      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
      - name: Checkout pinned Amethyst runtime
        run: |
          set -euo pipefail
          git init amethyst
          git -C amethyst remote add origin https://github.com/AngelAuraMC/Amethyst-Android.git
          git -C amethyst fetch --depth 1 origin "$AMETHYST_COMMIT"
          git -C amethyst checkout --detach FETCH_HEAD
          test "$(git -C amethyst rev-parse HEAD)" = "$AMETHYST_COMMIT"
          git -C amethyst submodule update --init --recursive --depth 1
      - name: Bundle Skin Bridge
        run: |
          set -euo pipefail
          JAR="$(find skin-source/bestiary-skin-bridge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -s "$JAR"
          mkdir -p amethyst/app_pojavlauncher/src/main/assets/bestiary
          cp "$JAR" amethyst/app_pojavlauncher/src/main/assets/bestiary/bestiary-skin-bridge.jar
      - name: Apply and verify Bestiary patches
        run: |
          set -euo pipefail
          python android-build/patch_bestiary_android.py
          python android-build/patch_android_compat.py
          python android-build/patch_runtime_metadata.py
          python android-build/patch_bestiary_android_v100.py
          python android-build/patch_bestiary_android_skin.py
          python android-build/patch_bestiary_android_hardening.py
          python android-build/patch_bestiary_android_runtime_v101.py
          python android-build/patch_bestiary_android_v102.py
          python android-build/patch_bestiary_android_v104_performance.py
          APP=amethyst/app_pojavlauncher
          grep -q 'applicationId "vn.svframe.bestiary.launcher"' "$APP/build.gradle"
          grep -q 'versionName "1.0.4"' "$APP/build.gradle"
          grep -q 'BestiaryAppUpdater.check(this)' "$APP/src/main/java/net/kdt/pojavlaunch/LauncherActivity.java"
          grep -q 'BestiaryPerformanceProfile.install(this)' "$APP/src/main/java/net/kdt/pojavlaunch/PojavApplication.java"
          grep -q 'resolutionRatio' "$APP/src/main/java/net/kdt/pojavlaunch/BestiaryPerformanceProfile.java"
          grep -q 'G1ReservePercent=15' "$APP/src/main/java/net/kdt/pojavlaunch/BestiaryJvmFlagGenerator.java"
          ! grep -q -- '-Xmx' "$APP/src/main/java/net/kdt/pojavlaunch/BestiaryJvmFlagGenerator.java"
          grep -q 'BestiaryDefaultControls.install(this)' "$APP/src/main/java/net/kdt/pojavlaunch/PojavApplication.java"
          test -s "$APP/src/main/assets/bestiary/keyboard_cobblemon.json"
          test -s "$APP/src/main/assets/bestiary/bestiary-skin-bridge.jar"
      - name: Generate language list
        working-directory: amethyst
        run: |
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh
      - name: Build debug APK
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build :app_pojavlauncher:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          mkdir -p build-output
          APK="$(find amethyst/app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" build-output/BestiaryLauncher-Android-1.0.4-debug.apk
          sha256sum build-output/BestiaryLauncher-Android-1.0.4-debug.apk > build-output/BestiaryLauncher-Android-1.0.4-debug-SHA256.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging build-output/BestiaryLauncher-Android-1.0.4-debug.apk | tee build-output/BestiaryLauncher-Android-1.0.4-debug-badging.txt
          grep -q "versionName='1.0.4'" build-output/BestiaryLauncher-Android-1.0.4-debug-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Android-1.0.4-debug
          path: build-output/*
          retention-days: 7
      - name: Publish verified Android CI manifest
        if: success() && github.event_name == 'push'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' build-output/BestiaryLauncher-Android-1.0.4-debug-SHA256.txt)"
          python - <<'PY' > /tmp/result.json
          import json, os
          sha=open('build-output/BestiaryLauncher-Android-1.0.4-debug-SHA256.txt').read().split()[0]
          print(json.dumps({'version':'1.0.4','variant':'debug','sha256':sha,'sourceCommit':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'runId':int(os.environ['GITHUB_RUN_ID']),'upstreamCommit':'360d708262ff703d9b52782d20cd348410a33df5','verified':True}, indent=2))
          PY
          CONTENT="$(base64 -w0 /tmp/result.json)"
          PATH_NAME="android-build/ci/${GITHUB_SHA}.json"
          python - "$CONTENT" <<'PY' > /tmp/payload.json
          import json,sys,os
          print(json.dumps({'message':'Record verified Bestiary Android 1.0.4 CI result [skip ci]','content':sys.argv[1],'branch':os.environ['GITHUB_REF_NAME']}))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/${PATH_NAME}" --input /tmp/payload.json >/dev/null
