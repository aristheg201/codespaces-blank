name: Build Bestiary Launcher Android 1.0.6 Resource Pack Hotfix

on:
  push:
    branches: [bestiary-android-v1-0-6-low-end-performance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AMETHYST_COMMIT: 360d708262ff703d9b52782d20cd348410a33df5
      ANDROID_NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Bestiary Skin Bridge source
        uses: actions/checkout@v4
        with:
          ref: bestiary-launcher-v5-1-0
          path: skin-source
          sparse-checkout: bestiary-skin-bridge

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Skin Bridge
        working-directory: skin-source/bestiary-skin-bridge
        run: |
          set -euo pipefail
          gradle build --stacktrace

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"

      - name: Checkout pinned Amethyst runtime
        run: |
          set -euo pipefail
          git init amethyst
          git -C amethyst remote add origin https://github.com/AngelAuraMC/Amethyst-Android.git
          git -C amethyst fetch --depth 1 origin "$AMETHYST_COMMIT"
          git -C amethyst checkout --detach FETCH_HEAD
          test "$(git -C amethyst rev-parse HEAD)" = "$AMETHYST_COMMIT"
          git -C amethyst submodule update --init --recursive --depth 1

      - name: Bundle Skin Bridge
        run: |
          set -euo pipefail
          JAR="$(find skin-source/bestiary-skin-bridge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -s "$JAR"
          mkdir -p amethyst/app_pojavlauncher/src/main/assets/bestiary
          cp "$JAR" amethyst/app_pojavlauncher/src/main/assets/bestiary/bestiary-skin-bridge.jar

      - name: Apply complete Bestiary patch set
        run: |
          set -euo pipefail
          python android-build/patch_bestiary_android.py
          python android-build/patch_android_compat.py
          python android-build/patch_runtime_metadata.py
          python android-build/patch_bestiary_android_v100.py
          python android-build/patch_bestiary_android_skin.py
          python android-build/patch_bestiary_android_hardening.py
          python android-build/patch_bestiary_android_runtime_v101.py
          python android-build/patch_bestiary_android_v102.py
          python android-build/patch_bestiary_android_v106_low_end_performance.py
          python android-build/patch_bestiary_android_v106_resourcepack_hotfix.py

      - name: Verify resource-pack stability contracts
        run: |
          set -euo pipefail
          APP=amethyst/app_pojavlauncher
          JAVA="$APP/src/main/java/net/kdt/pojavlaunch"
          grep -q 'applicationId "vn.svframe.bestiary.launcher"' "$APP/build.gradle"
          grep -q 'versionName "1.0.6"' "$APP/build.gradle"
          grep -q 'REVISION = 7' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'safeMaxHeapMb' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'clampHeapForLaunch' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'Unsafe Android heap allocation' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'bestiaryRequestedHeapMb' "$JAVA/utils/JREUtils.java"
          grep -q 'clampHeapForLaunch(activity' "$JAVA/utils/JREUtils.java"
          grep -q 'Bestiary resource-pack safety' "$JAVA/MainActivity.java"
          grep -q 'BestiaryPerformanceProfile.targetRefreshRate()' "$JAVA/MinecraftGLSurface.java"
          grep -q 'fullChunkRendering=' "$JAVA/Tools.java"
          grep -q 'while (lines.remove(chunkDisable))' "$JAVA/Tools.java"
          grep -q 'mixin.features.buffer_builder.intrinsics=false' "$JAVA/Tools.java"

      - name: Generate language list
        working-directory: amethyst
        run: |
          set -euo pipefail
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      - name: Build hotfix APK
        working-directory: amethyst
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build :app_pojavlauncher:assembleDebug --stacktrace --no-daemon

      - name: Verify hotfix APK
        run: |
          set -euo pipefail
          mkdir -p build-output
          APK="$(find amethyst/app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" build-output/BestiaryLauncher-Android-1.0.6-resourcepack-hotfix.apk
          sha256sum build-output/BestiaryLauncher-Android-1.0.6-resourcepack-hotfix.apk > build-output/BestiaryLauncher-Android-1.0.6-resourcepack-hotfix-SHA256.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging build-output/BestiaryLauncher-Android-1.0.6-resourcepack-hotfix.apk | tee build-output/badging.txt
          grep -q "package: name='vn.svframe.bestiary.launcher.debug'" build-output/badging.txt
          grep -q "versionName='1.0.6'" build-output/badging.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build-output/BestiaryLauncher-Android-1.0.6-resourcepack-hotfix.apk | tee build-output/signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Android-1.0.6-resourcepack-hotfix
          path: build-output/*
          retention-days: 14
          if-no-files-found: error
