name: Build Bestiary Launcher Android 1.0.0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'bestiary-android-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AMETHYST_COMMIT: 360d708262ff703d9b52782d20cd348410a33df5
      ANDROID_NDK_VERSION: 27.3.13750724
    steps:
      - name: Checkout Bestiary Android build definitions
        uses: actions/checkout@v4
        with:
          ref: bestiary-android-launcher-v1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"

      - name: Checkout pinned Amethyst runtime
        shell: bash
        run: |
          set -euo pipefail
          git init amethyst
          git -C amethyst remote add origin https://github.com/AngelAuraMC/Amethyst-Android.git
          git -C amethyst fetch --depth 1 origin "$AMETHYST_COMMIT"
          git -C amethyst checkout --detach FETCH_HEAD
          test "$(git -C amethyst rev-parse HEAD)" = "$AMETHYST_COMMIT"
          git -C amethyst submodule update --init --recursive --depth 1

      - name: Apply Bestiary Android patches
        shell: bash
        run: |
          set -euo pipefail
          python android-build/patch_bestiary_android.py
          python android-build/patch_android_compat.py
          grep -q 'applicationId "vn.svframe.bestiary.launcher"' amethyst/app_pojavlauncher/build.gradle
          grep -q '1.21.1/0.18.4/profile/json' amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/BestiaryBootstrap.java
          grep -q 'opengles_mobileglues' amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/BestiaryBootstrap.java

      - name: Generate language list
        working-directory: amethyst
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      - name: Build debug APK
        working-directory: amethyst
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build :app_pojavlauncher:assembleDebug --stacktrace --no-daemon

      - name: Stage APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          APK="$(find amethyst/app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" build-output/BestiaryLauncher-Android-1.0.0-debug.apk
          sha256sum build-output/BestiaryLauncher-Android-1.0.0-debug.apk > build-output/BestiaryLauncher-Android-1.0.0-debug-SHA256.txt
          ls -lh build-output/BestiaryLauncher-Android-1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Android-1.0.0-debug
          path: |
            build-output/BestiaryLauncher-Android-1.0.0-debug.apk
            build-output/BestiaryLauncher-Android-1.0.0-debug-SHA256.txt
          if-no-files-found: error
          retention-days: 7
