name: Build Bestiary Android 1.0.6 Resource-Pack Safe

on:
  push:
    branches: [bestiary-android-v1-0-6-low-end-performance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AMETHYST_COMMIT: 360d708262ff703d9b52782d20cd348410a33df5
      ANDROID_NDK_VERSION: 27.3.13750724
      MG_135_URL: https://github.com/MobileGL-Dev/MobileGlues-release/releases/download/V1.3.5/MobileGlues_1.3.5.apk
      MG_135_APK_SHA256: 228d44d812be7793a9cff42de4251ae8bab338a15e851572c08c9265818c41ba
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Bestiary Skin Bridge source
        uses: actions/checkout@v4
        with:
          ref: bestiary-launcher-v5-1-0
          path: skin-source
          sparse-checkout: bestiary-skin-bridge

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Skin Bridge
        working-directory: skin-source/bestiary-skin-bridge
        run: |
          set -euo pipefail
          gradle build --stacktrace

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"

      - name: Checkout pinned Amethyst runtime
        run: |
          set -euo pipefail
          git init amethyst
          git -C amethyst remote add origin https://github.com/AngelAuraMC/Amethyst-Android.git
          git -C amethyst fetch --depth 1 origin "$AMETHYST_COMMIT"
          git -C amethyst checkout --detach FETCH_HEAD
          test "$(git -C amethyst rev-parse HEAD)" = "$AMETHYST_COMMIT"
          git -C amethyst submodule update --init --recursive --depth 1

      - name: Pin MobileGlues 1.3.5
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          MG_APK="$TMP/MobileGlues_1.3.5.apk"
          AAR="$GITHUB_WORKSPACE/amethyst/app_pojavlauncher/libs/MobileGlues-release.aar"

          curl --fail --location --retry 3 --retry-all-errors --output "$MG_APK" "$MG_135_URL"
          echo "$MG_135_APK_SHA256  $MG_APK" | sha256sum --check --strict

          mkdir -p "$TMP/apk" "$TMP/aar"
          unzip -q "$MG_APK" 'lib/*/libmobileglues.so' -d "$TMP/apk"
          unzip -q "$AAR" -d "$TMP/aar"
          test -s "$TMP/apk/lib/arm64-v8a/libmobileglues.so"
          test -s "$TMP/aar/jni/arm64-v8a/libmobileglues.so"
          cp "$TMP/aar/jni/arm64-v8a/libmobileglues.so" "$TMP/mobileglues-old-arm64.so"

          REPLACED=0
          for SRC in "$TMP"/apk/lib/*/libmobileglues.so; do
            ABI="$(basename "$(dirname "$SRC")")"
            DST="$TMP/aar/jni/$ABI/libmobileglues.so"
            if [ -f "$DST" ]; then
              cp "$SRC" "$DST"
              REPLACED=$((REPLACED + 1))
            fi
          done
          test "$REPLACED" -ge 1

          rm -f "$AAR"
          (cd "$TMP/aar" && zip -qr "$AAR" .)
          unzip -t "$AAR" >/dev/null
          unzip -p "$AAR" jni/arm64-v8a/libmobileglues.so > "$TMP/mobileglues-new-arm64.so"
          cmp -s "$TMP/mobileglues-old-arm64.so" "$TMP/mobileglues-new-arm64.so" && {
            echo 'MobileGlues native core did not change' >&2
            exit 1
          }

          echo "MobileGlues release APK: $MG_135_APK_SHA256" > mobileglues-provenance.txt
          echo "Replaced ABI count: $REPLACED" >> mobileglues-provenance.txt
          sha256sum "$TMP/mobileglues-new-arm64.so" >> mobileglues-provenance.txt
          file "$TMP/mobileglues-new-arm64.so" | tee -a mobileglues-provenance.txt

      - name: Bundle Skin Bridge
        run: |
          set -euo pipefail
          JAR="$(find skin-source/bestiary-skin-bridge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -s "$JAR"
          mkdir -p amethyst/app_pojavlauncher/src/main/assets/bestiary
          cp "$JAR" amethyst/app_pojavlauncher/src/main/assets/bestiary/bestiary-skin-bridge.jar

      - name: Apply complete Bestiary patch set
        run: |
          set -euo pipefail
          python -m py_compile android-build/patch_bestiary_android_v106_resourcepack_hotfix.py
          python android-build/patch_bestiary_android.py
          python android-build/patch_android_compat.py
          python android-build/patch_runtime_metadata.py
          python android-build/patch_bestiary_android_v100.py
          python android-build/patch_bestiary_android_skin.py
          python android-build/patch_bestiary_android_hardening.py
          python android-build/patch_bestiary_android_runtime_v101.py
          python android-build/patch_bestiary_android_v102.py
          python android-build/patch_bestiary_android_v106_low_end_performance.py
          python android-build/patch_bestiary_android_v106_resourcepack_hotfix.py

      - name: Verify resource-pack safety contracts
        run: |
          set -euo pipefail
          APP=amethyst/app_pojavlauncher
          JAVA="$APP/src/main/java/net/kdt/pojavlaunch"

          grep -q 'applicationId "vn.svframe.bestiary.launcher"' "$APP/build.gradle"
          grep -q 'versionName "1.0.6"' "$APP/build.gradle"
          grep -q 'REVISION = 8' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'RESOURCE_PACK_SAFE_KEY' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'resourcePackSafeModeEnabled' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'safeMaxHeapMb' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'return 1792;' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'clampHeapForLaunch' "$JAVA/BestiaryPerformanceProfile.java"
          grep -q 'bestiaryRequestedHeapMb' "$JAVA/utils/JREUtils.java"
          grep -q 'clampHeapForLaunch(activity' "$JAVA/utils/JREUtils.java"
          grep -q 'bestiary-hs_err_pid%p.log' "$JAVA/utils/JREUtils.java"
          grep -q 'versionPolicy=0.6.13-native' "$JAVA/Tools.java"
          grep -q 'while (lines.remove(legacyIntrinsic))' "$JAVA/Tools.java"
          grep -q 'while (lines.remove(legacyChunk))' "$JAVA/Tools.java"
          ! grep -q 'fullChunkRendering=' "$JAVA/Tools.java"
          grep -q 'MCOptionUtils.set("mipmapLevels", "0")' "$JAVA/BestiaryGamePerformanceDefaults.java"
          grep -q 'Resource-pack safe mode active' "$JAVA/BestiaryResourcePackSafety.java"
          grep -q 'MCOptionUtils.set("mipmapLevels", "0")' "$JAVA/BestiaryResourcePackSafety.java"
          grep -q 'BestiaryResourcePackSafety.applyMinecraftOptions()' "$JAVA/MainActivity.java"
          grep -q 'bestiary_resourcepack_safe_mode' "$APP/src/main/res/xml/pref_renderer.xml"
          grep -q 'BestiaryPerformanceProfile.targetRefreshRate()' "$JAVA/MinecraftGLSurface.java"
          ! grep -q 'float maxHz = 120f' "$JAVA/MinecraftGLSurface.java"
          grep -q 'Continuous native logcat mirror disabled' "$JAVA/utils/JREUtils.java"
          grep -q 'LOCAL_RENDERER.toLowerCase(Locale.ROOT).contains("zink")' "$JAVA/utils/JREUtils.java"
          grep -q 'bestiary-android-manifest-cache.json' "$JAVA/BestiaryBootstrap.java"
          grep -q 'matchesVerificationCache' "$JAVA/BestiaryBootstrap.java"
          test -s "$APP/libs/MobileGlues-release.aar"
          unzip -t "$APP/libs/MobileGlues-release.aar" >/dev/null
          test -s "$APP/src/main/assets/bestiary/keyboard_cobblemon.json"
          test -s "$APP/src/main/assets/bestiary/bestiary-skin-bridge.jar"

      - name: Generate language list
        working-directory: amethyst
        run: |
          set -euo pipefail
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      - name: Build final APK
        working-directory: amethyst
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build :app_pojavlauncher:assembleDebug --stacktrace --no-daemon

      - name: Verify final APK
        run: |
          set -euo pipefail
          mkdir -p build-output
          APK="$(find amethyst/app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          cp "$APK" build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2.apk
          cp mobileglues-provenance.txt build-output/
          sha256sum build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2.apk > build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2-SHA256.txt

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2.apk | tee build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2-badging.txt
          grep -q "package: name='vn.svframe.bestiary.launcher.debug'" build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2-badging.txt
          grep -q "versionName='1.0.6'" build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2-badging.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2.apk | tee build-output/BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2-signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Android-1.0.6-resourcepack-safe-v2
          path: build-output/*
          retention-days: 14
          if-no-files-found: error
