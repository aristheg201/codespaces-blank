name: Release Bestiary Launcher 5.4.3 Lifecycle Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-bestiary-launcher-v543.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: bestiary-launcher-v543-release
  cancel-in-progress: true

env:
  SOURCE_BRANCH: bestiary-launcher-v5-4-3-lifecycle-fix

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Record 5.4.3 run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $body = [ordered]@{version='5.4.3';branch=$env:SOURCE_BRANCH;runId=[long]$env:GITHUB_RUN_ID;status='running'} | ConvertTo-Json -Compress
          $enc = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          $path = 'bestiary-v543/ci-running.json'
          $old = ''
          gh api "repos/$env:GITHUB_REPOSITORY/contents/${path}?ref=$env:SOURCE_BRANCH" --jq '.sha' 2>$null | ForEach-Object { $old = $_ }
          $payload = @{message='Record Launcher 5.4.3 CI start [skip ci]';content=$enc;branch=$env:SOURCE_BRANCH}
          if ($old) { $payload.sha = $old }
          ($payload | ConvertTo-Json -Compress) | gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/${path}" --input - *> $null

      - name: Checkout Launcher 5.4.3 source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Bestiary Skin Bridge
        working-directory: bestiary-skin-bridge
        shell: pwsh
        run: gradle build --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and lifecycle-test Launcher 5.4.3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./bestiary-v543/build.ps1 *>&1 | Tee-Object -FilePath ci-v543.log
          if($LASTEXITCODE -ne 0){throw "5.4.3 build returned $LASTEXITCODE"}

      - name: Upload verified Launcher 5.4.3
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.4.3
          path: |
            build-output-v543/BestiaryLauncher-Setup-5.4.3.exe
            build-output-v543/BestiaryLauncher-Setup-5.4.3-SHA256.txt
            build-output-v543/lifecycle-contract.txt
            build-output-v543/runtime-lifecycle-*.log
            build-output-v543/diagnostic-source/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: BestiaryLauncher-Windows-5.4.3
          path: publish

      - name: Verify release payload
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find publish -type f -name 'BestiaryLauncher-Setup-5.4.3.exe' -print -quit)"
          HASHFILE="$(find publish -type f -name 'BestiaryLauncher-Setup-5.4.3-SHA256.txt' -print -quit)"
          CONTRACT="$(find publish -type f -name 'lifecycle-contract.txt' -print -quit)"
          test -n "$EXE" && test -s "$EXE"
          test -n "$HASHFILE" && test -s "$HASHFILE"
          test -n "$CONTRACT" && test -s "$CONTRACT"
          grep -q '^singleInstanceLockCount=1$' "$CONTRACT"
          grep -q '^secondInstanceRestoresWindow=true$' "$CONTRACT"
          grep -q '^activateRestoresWindow=true$' "$CONTRACT"
          grep -q '^lastWindowForcesExit=true$' "$CONTRACT"
          grep -q '^closeReopenRuntimeVerified=true$' "$CONTRACT"
          grep -q '^secondInvocationRuntimeVerified=true$' "$CONTRACT"
          EXPECTED="$(tr -d '\r' < "$HASHFILE" | awk '{print tolower($1)}')"
          ACTUAL="$(sha256sum "$EXE" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "hashfile=$HASHFILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Publish Launcher 5.4.3 release
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.verify.outputs.exe }}
          HASHFILE: ${{ steps.verify.outputs.hashfile }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete launcher-v5.4.3 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create launcher-v5.4.3 "$EXE" "$HASHFILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bestiary Launcher 5.4.3" \
            --notes "Fixes Windows launcher lifecycle and relaunch behavior. The Electron single-instance lock is acquired once, a second invocation restores or recreates the existing window, and closing the final Windows/Linux launcher window terminates the launcher process. CI now verifies open -> close -> full process exit -> reopen with a visible window, plus second-instance behavior."

      - name: Record verified release marker on source branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -nc --arg sha "$SHA256" --arg branch "$SOURCE_BRANCH" --argjson run "$GITHUB_RUN_ID" '{version:"5.4.3",sha256:$sha,branch:$branch,runId:$run,singleInstanceLockCount:1,secondInstanceRestoresWindow:true,activateRestoresWindow:true,lastWindowForcesExit:true,closeReopenRuntimeVerified:true,secondInvocationRuntimeVerified:true,releasePublished:true,verified:true}')
          ENC=$(printf '%s' "$BODY" | base64 -w0)
          PATH_NAME='bestiary-v543/ci-build.json'
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME?ref=$SOURCE_BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            jq -nc --arg message 'Record verified Launcher 5.4.3 release [skip ci]' --arg content "$ENC" --arg branch "$SOURCE_BRANCH" --arg sha "$OLD" '{message:$message,content:$content,branch:$branch,sha:$sha}' | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME" --input - >/dev/null
          else
            jq -nc --arg message 'Record verified Launcher 5.4.3 release [skip ci]' --arg content "$ENC" --arg branch "$SOURCE_BRANCH" '{message:$message,content:$content,branch:$branch}' | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME" --input - >/dev/null
          fi
